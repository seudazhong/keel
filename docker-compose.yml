# Keel — Docker Compose (ADR-0008 profiles).
#
#   docker compose -f docker-compose.yml --profile dev up -d --build
#
# The `dev`/`full` profiles run a TRUSTED, single-operator LOCAL PREVIEW — not a
# production deployment. Compose ships no `keel-sandbox` executor and no RPC secret,
# so the default fail-closed `sandbox` backend would crash server/worker on startup.
# Instead they EXPLICITLY opt into the in-process `unsafe-local-dev` backend, confined
# to a dedicated empty `execdata` volume, with shell/command execution left DISABLED
# because Compose cannot prove an OS isolation boundary. Code defaults and the K8s /
# cloud manifests remain fail-closed `sandbox`; never reuse these preview settings in
# production. Pass `-f docker-compose.yml` so a local `docker-compose.override.yml`
# cannot silently relax this contract.
#
# Compose lives at the repo root so the build context is the workspace root
# (packages/ must be reachable). Dockerfiles are under deploy/docker/.
name: keel

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/app.Dockerfile
  image: keel-app:dev

x-app-env: &app-env
  KEEL_DATABASE_URL: postgresql+psycopg://keel:keel@postgres:5432/keel
  KEEL_REDIS_URL: redis://redis:6379/0
  # Shared project/coding storage root: server and worker MUST mount the SAME volume
  # here so a worker-written review artifact is readable by the server report APIs (WS-R).
  KEEL_PROJECT_STORAGE_ROOT: /var/lib/keel/projects

# Trusted LOCAL preview execution — applied to keel-server and keel-worker only.
# This is deliberately NOT a production sandbox: it names the runtime `unsafe-local-dev`
# and requires the explicit opt-in flag below. The execution workspace is the empty
# `execdata` volume (via each service's `working_dir`), and shell/command execution stays
# DISABLED because KEEL_TRUSTED_PREVIEW_SHELL_WORKSPACE_SANITIZED is left unset (-> false):
# Compose cannot prove the sanitized-workspace/OS-isolation contract, so file tools work
# while shell is denied. Do NOT set these on K8s/cloud, where the fail-closed `sandbox`
# backend with an authenticated RPC secret is mandatory.
x-trusted-preview-exec: &trusted-preview-exec
  KEEL_APP_ENV: dev
  KEEL_EXECUTION_BACKEND: unsafe-local-dev
  KEEL_TRUSTED_PREVIEW_ALLOW_UNSAFE_EXECUTION: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  # First-run bootstrap: idempotent schema migrate (DR-4). Runs once and exits.
  keel-migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["dev", "full"]

  keel-server:
    <<: *app
    command: ["keel-server"]
    working_dir: /var/lib/keel/exec
    volumes:
      - "projectdata:/var/lib/keel/projects"
      - "execdata:/var/lib/keel/exec"
    environment:
      <<: [*app-env, *trusted-preview-exec]
      KEEL_SERVER_HOST: 0.0.0.0
      KEEL_SERVER_PORT: 8000
      OLLAMA_API_BASE: "http://ollama:11434"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keel-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["dev", "full"]

  # Stateless & horizontally scalable: run N replicas with
  #   docker compose up -d --scale keel-worker=3
  # arq gives each agent job to exactly one worker, and coordinates the scheduler_tick
  # cron across replicas (Redis lock) so it runs once per tick. As defense-in-depth the
  # tick's enqueue is idempotent regardless: an atomic compare-and-set on
  # schedules.next_run_at (+ a RETURNING update for approval expiry) enqueues a due
  # schedule at most once at any replica count (invariant I9).
  keel-worker:
    <<: *app
    command: ["arq", "keel_worker.main.WorkerSettings"]
    working_dir: /var/lib/keel/exec
    volumes:
      - "projectdata:/var/lib/keel/projects"
      - "execdata:/var/lib/keel/exec"
    deploy:
      replicas: 1  # override with `--scale keel-worker=N`; scale-out is CAS-safe
    environment:
      <<: [*app-env, *trusted-preview-exec]
      OLLAMA_API_BASE: "http://ollama:11434"
    depends_on:
      redis:
        condition: service_healthy
      keel-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "arq", "keel_worker.main.WorkerSettings", "--check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["dev", "full"]

  keel-web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    image: keel-web:dev
    ports: ["3000:80"]
    depends_on:
      keel-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/web-health"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["dev", "full"]

  ollama-pull:
    image: ollama/ollama:latest
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    profiles: ["dev", "full"]

volumes:
  pgdata:
  ollama:
  # Dedicated, initially-empty execution workspace for the trusted local-preview
  # `unsafe-local-dev` backend (server + worker share it via `working_dir`). Kept
  # separate from source/projects so preview file tools never touch the repo tree.
  execdata:
  # Shared managed-project/coding storage (server + worker). In a multi-host cloud
  # deployment replace this with an RWX volume (e.g. NFS/EFS) so BOTH pods share it.
  projectdata:

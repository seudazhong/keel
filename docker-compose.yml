# Keel — Docker Compose (ADR-0008 profiles).
#
#   docker compose -f docker-compose.yml --profile dev up -d --build
#
# The `dev`/`full` profiles run a REAL, authenticated sandbox execution boundary — not the
# old in-process preview. `keel-server`/`keel-worker` use the fail-closed `execution_backend=
# sandbox`: every model-chosen file/shell tool call is sent over an INTERNAL RPC network to a
# dedicated, hardened `keel-sandbox` executor, so the control plane runs NO tool operation in
# process and never mounts the sandbox workspace. RPC is HMAC-authenticated; a one-shot
# `keel-secret-init` generates a random >=32-byte shared secret into a dedicated volume and
# every service loads it from a read-only file (`KEEL_SANDBOX_RPC_SECRET_FILE`), so no secret
# is hard-coded in this file/source and none appears in argv or logs. Wiring fails CLOSED: an
# unreachable or misauthenticated sandbox makes server readiness/worker startup refuse rather
# than silently fall back to local. Code defaults and the K8s / cloud manifests keep this same
# fail-closed `sandbox` backend.
#
# HONEST SCOPE / KNOWN DOWNGRADES (this is a trusted single-org preview, NOT a hostile
# multi-tenant platform):
#   * The `keel-sandbox` container is the accepted rootless-OCI floor (ADR-0005 / design §9):
#     non-root, read-only rootfs, all Linux capabilities dropped, no-new-privileges, tmpfs
#     scratch, default-deny egress on an INTERNAL network, holding ONLY the RPC secret (no
#     Docker socket, no project storage, no DB/Redis/GitHub credentials). It is NOT a
#     gVisor/Kata/microVM boundary — a kernel-level container escape is still out of scope
#     here (that gate is `runtimeClassName`, deploy/k8s/base/sandbox/runtimeclass.example.yaml).
#   * File tools are isolated per scope by an opaque `ws_<hash>` namespace under the sandbox's
#     own namespaces root. SHELL/command execution stays DISABLED: namespaced shell is denied
#     (a namespace dir is not an OS mount boundary — KEEL_SANDBOX_NAMESPACE_SHELL_ISOLATED is
#     never set), and unscoped shell is denied too because the default workspace and the
#     namespaces coexist in one container, so no shell can be proven confined to a single
#     workspace (KEEL_SANDBOX_WORKSPACE_SANITIZED is left unset). No fake isolation flag is set.
#   * Compose networks are bidirectional: `keel-sandbox` shares one internal network with
#     server/worker for the RPC path. It cannot reach Postgres/Redis/Ollama (not on that
#     network) or the public internet (the network is `internal: true`) and holds no
#     credentials, but Compose cannot express the per-direction NetworkPolicy that deploy/k8s
#     does. Treat this as the documented Compose-tier downgrade, still fail-closed.
#
# Pass `-f docker-compose.yml` so a local `docker-compose.override.yml` cannot silently relax
# this contract. Compose lives at the repo root so the build context is the workspace root
# (packages/ must be reachable). Dockerfiles are under deploy/docker/.
name: keel

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/app.Dockerfile
  image: keel-app:dev

x-app-env: &app-env
  KEEL_DATABASE_URL: postgresql+psycopg://keel:keel@postgres:5432/keel
  KEEL_REDIS_URL: redis://redis:6379/0
  # Shared project/coding storage root: server and worker MUST mount the SAME volume
  # here so a worker-written review artifact is readable by the server report APIs (WS-R).
  KEEL_PROJECT_STORAGE_ROOT: /var/lib/keel/projects

# Real sandbox execution — applied to keel-server and keel-worker only. Both call the isolated
# keel-sandbox executor over the internal RPC network; they run NO file/shell tool in process
# and mount NO sandbox workspace. The HMAC shared secret is read from a generated, read-only
# file (never inlined here / in argv / in logs). Keep the fail-closed `sandbox` backend in
# K8s/cloud too — never swap it for an in-process backend there.
x-sandbox-exec: &sandbox-exec
  KEEL_APP_ENV: dev
  KEEL_EXECUTION_BACKEND: sandbox
  KEEL_SANDBOX_URL: http://keel-sandbox:8090
  KEEL_SANDBOX_RPC_SECRET_FILE: /keel-secrets/sandbox_rpc_secret

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  # First-run bootstrap: idempotent schema migrate (DR-4). Runs once and exits. Needs no
  # sandbox secret — it only runs Alembic, never the server/worker tool wiring.
  keel-migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["dev", "full"]

  # Local secret bootstrap (runs once, then exits). Generates a random >=32-byte RPC shared
  # secret directly into the `sandboxsecret` volume the FIRST time only (idempotent), so a
  # single `up` needs no manual secret provisioning and no secret is committed to this file or
  # source. The value is generated in-process and written straight to the mounted file — it is
  # never passed on argv and never printed — then made read-only. keel-server/keel-worker and
  # keel-sandbox each mount this volume read-only and load the secret via
  # KEEL_SANDBOX_RPC_SECRET_FILE. Delete the `sandboxsecret` volume to rotate.
  keel-secret-init:
    <<: *app
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, pathlib, secrets
        path = pathlib.Path("/keel-secrets/sandbox_rpc_secret")
        path.parent.mkdir(parents=True, exist_ok=True)
        if not path.exists() or not path.read_text().strip():
            # token_urlsafe(48) -> 64 url-safe chars, comfortably above the 32-byte minimum
            # (keel_core.tools.rpc_auth.MIN_RPC_SECRET_BYTES). Generated here and written
            # straight to the mounted volume; never echoed to argv or logs.
            path.write_text(secrets.token_urlsafe(48))
        os.chmod(path, 0o444)
        print("keel sandbox RPC secret present (>=32 bytes); value not logged")
    volumes:
      - "sandboxsecret:/keel-secrets"
    restart: "no"
    profiles: ["dev", "full"]

  # The ONLY container that runs model-chosen file/shell tool operations. Hardened rootless-OCI
  # floor: non-root (uid 10100), read-only root filesystem, ALL capabilities dropped,
  # no-new-privileges, tmpfs scratch. Its ONLY writable mounts are its own workspace + per-scope
  # namespaces volumes; the RPC secret is mounted READ-ONLY. It is on an INTERNAL-only network
  # (no public egress), is NOT on the Postgres/Redis/Ollama network, has NO Docker socket, NO
  # project storage, and NO DB/Redis/GitHub credentials. See the honest-scope note in the header
  # for what this is NOT (a microVM / multi-tenant boundary).
  keel-sandbox:
    build:
      context: .
      dockerfile: deploy/docker/sandbox.Dockerfile
    image: keel-sandbox:dev
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    user: "10100:10100"
    networks:
      - sandboxnet
    environment:
      KEEL_APP_ENV: dev
      KEEL_SANDBOX_HOST: 0.0.0.0
      KEEL_SANDBOX_PORT: "8090"
      KEEL_SANDBOX_WORKSPACE: /sandbox/workspace
      KEEL_SANDBOX_NAMESPACES_ROOT: /sandbox/namespaces
      # Honest operator assertion for the rootless-OCI floor: this container mounts ONLY the
      # sandbox workspace/namespaces (+ the read-only secret) — never the host repo/.git/.env
      # or project storage — and enforces default-deny egress (internal network + EgressPolicy),
      # so real operations are served instead of failing 503. It is NOT a microVM assertion.
      KEEL_SANDBOX_ISOLATION_VERIFIED: "true"
      # DELIBERATELY UNSET (shell stays denied, honestly):
      #  - KEEL_SANDBOX_WORKSPACE_SANITIZED: default workspace + namespaces coexist here, so no
      #    unscoped shell can be proven confined to a single workspace.
      #  - KEEL_SANDBOX_NAMESPACE_SHELL_ISOLATED: a namespace dir is not an OS/microVM mount
      #    boundary, so a namespaced shell subprocess could escape via absolute/derived paths.
      # File tools remain available and per-scope isolated; command execution is fail-closed.
      KEEL_SANDBOX_RPC_SECRET_FILE: /keel-secrets/sandbox_rpc_secret
    tmpfs:
      - /tmp
    volumes:
      - "sandboxworkspace:/sandbox/workspace"
      - "sandboxnamespaces:/sandbox/namespaces"
      - "sandboxsecret:/keel-secrets:ro"
    depends_on:
      keel-secret-init:
        condition: service_completed_successfully
    healthcheck:
      # Unauthenticated liveness only; authenticated readiness is proven by keel-server /
      # keel-worker via the signed /v1/ping. This never exposes the secret or workspace state.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["dev", "full"]

  keel-server:
    <<: *app
    command: ["keel-server"]
    networks:
      - default
      - sandboxnet
    volumes:
      - "projectdata:/var/lib/keel/projects"
      - "sandboxsecret:/keel-secrets:ro"
    environment:
      <<: [*app-env, *sandbox-exec]
      KEEL_SERVER_HOST: 0.0.0.0
      KEEL_SERVER_PORT: 8000
      OLLAMA_API_BASE: "http://ollama:11434"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keel-migrate:
        condition: service_completed_successfully
      keel-secret-init:
        condition: service_completed_successfully
      keel-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["dev", "full"]

  # Stateless & horizontally scalable: run N replicas with
  #   docker compose up -d --scale keel-worker=3
  # arq gives each agent job to exactly one worker, and coordinates the scheduler_tick
  # cron across replicas (Redis lock) so it runs once per tick. As defense-in-depth the
  # tick's enqueue is idempotent regardless: an atomic compare-and-set on
  # schedules.next_run_at (+ a RETURNING update for approval expiry) enqueues a due
  # schedule at most once at any replica count (invariant I9).
  keel-worker:
    <<: *app
    command: ["arq", "keel_worker.main.WorkerSettings"]
    networks:
      - default
      - sandboxnet
    volumes:
      - "projectdata:/var/lib/keel/projects"
      - "sandboxsecret:/keel-secrets:ro"
    deploy:
      replicas: 1  # override with `--scale keel-worker=N`; scale-out is CAS-safe
    environment:
      <<: [*app-env, *sandbox-exec]
      OLLAMA_API_BASE: "http://ollama:11434"
    depends_on:
      redis:
        condition: service_healthy
      keel-migrate:
        condition: service_completed_successfully
      keel-secret-init:
        condition: service_completed_successfully
      keel-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "keel_worker.main.WorkerSettings", "--check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["dev", "full"]

  keel-web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    image: keel-web:dev
    ports: ["3000:80"]
    depends_on:
      keel-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/web-health"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["dev", "full"]

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["dev", "full"]

  ollama-pull:
    image: ollama/ollama:latest
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    profiles: ["dev", "full"]

networks:
  # Control-plane + datastores (Postgres/Redis/Ollama, web -> server). Auto-created by Compose;
  # declared here so keel-server/keel-worker can also attach to the internal sandbox network.
  default:
  # Internal-only RPC path between the control plane and the sandbox executor. `internal: true`
  # gives the sandbox NO route to the public internet; it is deliberately NOT joined by
  # Postgres/Redis/Ollama, so the sandbox has no control-plane data path either.
  sandboxnet:
    internal: true

volumes:
  pgdata:
  ollama:
  # Shared managed-project/coding storage (server + worker). In a multi-host cloud
  # deployment replace this with an RWX volume (e.g. NFS/EFS) so BOTH pods share it.
  projectdata:
  # The sandbox executor's OWN writable trees (mounted only into keel-sandbox): the default
  # single/unscoped workspace and the per-scope `ws_<hash>` namespaces root. Kept off the
  # control plane so server/worker never touch tool-written files directly.
  sandboxworkspace:
  sandboxnamespaces:
  # Generated RPC shared secret (written once by keel-secret-init; mounted read-only into
  # server/worker/sandbox). Delete this volume to rotate the secret.
  sandboxsecret:

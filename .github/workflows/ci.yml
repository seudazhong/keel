name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint · Type · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy packages

      - name: OpenAPI compatibility
        run: uv run python scripts/check_openapi_compat.py

      - name: Documentation links
        run: uv run python scripts/check_markdown_links.py

      - name: Pytest
        run: uv run pytest -m "not integration"

  build-image:
    name: Build app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates the Dockerfile and that `uv sync --frozen` resolves on
      # linux/python3.12 from the committed lockfile.
      - name: Build keel-app image
        run: docker build -f deploy/docker/app.Dockerfile -t keel-app:ci .

  integration:
    name: Integration (Postgres · Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keel -d keel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace (frozen)
        run: uv sync --frozen

      - name: Integration tests (spikes S4, S5-RLS)
        run: uv run pytest -m integration
        env:
          KEEL_TEST_DATABASE_URL: postgresql+psycopg://keel:keel@localhost:5432/keel_test
          KEEL_EVAL_DATABASE_URL: postgresql+psycopg://keel:keel@localhost:5432/keel_test
          KEEL_TEST_REDIS_URL: redis://localhost:6379/0

# Keel — uv workspace root (virtual: no root package).
# Members are the packages under packages/*. See docs/ARCHITECTURE.md §15.2.

[tool.uv.workspace]
members = ["packages/*"]

# All keel-* interdependencies resolve from the workspace, not PyPI.
[tool.uv.sources]
keel-core = { workspace = true }
keel-server = { workspace = true }
keel-worker = { workspace = true }
keel-scheduler = { workspace = true }
keel-sandbox = { workspace = true }
keel-cli = { workspace = true }
keel-sdk = { workspace = true }

[dependency-groups]
dev = [
    "alembic>=1.13",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[project]
name = "keel-worker"
version = "0.0.0"
description = "Keel arq worker — executes agent runs and background jobs."
requires-python = ">=3.12"
dependencies = [
    "keel-core",
    "arq>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_worker"]

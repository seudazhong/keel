[project]
name = "keel-core"
version = "0.0.0"
description = "Keel agent runtime core — pure library, no transport (ADR-0001)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "litellm>=1.40",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_core"]

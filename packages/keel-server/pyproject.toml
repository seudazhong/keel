[project]
name = "keel-server"
version = "0.0.0"
description = "Keel FastAPI server — API/auth/admin/SSE-WS and gateway host."
requires-python = ">=3.12"
dependencies = [
    "keel-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
keel-server = "keel_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_server"]

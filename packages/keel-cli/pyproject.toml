[project]
name = "keel-cli"
version = "0.0.0"
description = "Keel CLI — admin/power-user client (ADR-0009)."
requires-python = ">=3.12"
dependencies = [
    "keel-core",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
keel = "keel_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_cli"]

[project]
name = "keel-sdk"
version = "0.0.0"
description = "Keel SDK — build custom tools/agents (footprint ladder; lands in M1/M3)."
requires-python = ">=3.12"
dependencies = [
    "keel-core",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_sdk"]

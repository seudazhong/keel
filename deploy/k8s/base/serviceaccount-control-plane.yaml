# Control-plane identity used by keel-server to create/watch/delete per-run sandbox Jobs
# (base/sandbox/job-template.yaml). Workers/scheduler do not need Kubernetes API access and
# should NOT be bound to this Role — only keel-server's ServiceAccount is bound below.
#
# This is deliberately narrow: create/get/list/watch/delete on Jobs and Pods (to read status/
# logs) in this namespace only. It cannot read Secrets, create RBAC, or touch other
# namespaces. It is still a real capability grant — treat keel-server as more trusted than
# keel-worker/keel-scheduler for this reason, and keep this Role out of the sandbox path
# entirely (sandbox Jobs use base/sandbox/serviceaccount.yaml, which has no Role at all).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-control-plane
  labels:
    app.kubernetes.io/part-of: keel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-sandbox-job-manager
  labels:
    app.kubernetes.io/part-of: keel
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-control-plane-sandbox-job-manager
  labels:
    app.kubernetes.io/part-of: keel
subjects:
  - kind: ServiceAccount
    name: keel-control-plane
roleRef:
  kind: Role
  name: keel-sandbox-job-manager
  apiGroup: rbac.authorization.k8s.io

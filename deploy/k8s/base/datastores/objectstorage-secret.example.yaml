# TEMPLATE — copy, fill from a real secret manager, and never commit the result. Same pattern
# as ../secret-app.example.yaml: excluded from kustomization.yaml resources on purpose.
#
# Object storage (S3-compatible: AWS S3, MinIO, GCS via S3 interop, etc.) holds immutable Git
# bundles/snapshots, backups, and spilled tool output/artifacts (design doc §2.3/§3.8) — never
# a directly mutated bare repository. See ../../docs/storage-topology.md.
apiVersion: v1
kind: Secret
metadata:
  name: keel-object-storage-secret
  labels:
    app.kubernetes.io/part-of: keel
type: Opaque
stringData:
  KEEL_OBJECT_STORAGE_ENDPOINT: "https://CHANGEME.s3.amazonaws.com"
  KEEL_OBJECT_STORAGE_BUCKET: "CHANGEME-keel-artifacts"
  KEEL_OBJECT_STORAGE_ACCESS_KEY_ID: "CHANGEME"
  KEEL_OBJECT_STORAGE_SECRET_ACCESS_KEY: "CHANGEME"
  # Prefer workload identity (IRSA/Workload Identity/Managed Identity) over static keys where
  # your cloud provider supports it; delete the two access-key fields above if so.

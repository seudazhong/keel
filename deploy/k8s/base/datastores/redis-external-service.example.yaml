# Reference-only Service pointing at Redis (queue/lock/pub-sub backbone, ARCHITECTURE §15).
# As with Postgres, prefer a managed Redis (ElastiCache/Memorystore/Azure Cache) or a
# supported in-cluster operator over a hand-rolled StatefulSet; the scheduler's Redis-lock
# leader election and arq's job dispatch both depend on Redis's own durability/availability
# guarantees, so treat it as a production dependency with its own SLO
# (see ../../docs/slo-alerting.md), not disposable cache.
apiVersion: v1
kind: Service
metadata:
  name: keel-redis
  labels:
    app.kubernetes.io/part-of: keel
spec:
  type: ExternalName
  externalName: REPLACE_WITH_MANAGED_REDIS_HOSTNAME

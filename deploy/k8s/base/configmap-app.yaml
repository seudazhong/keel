# Non-secret application configuration, mirrors .env.example / docs/OPERATIONS.md.
# Do NOT add provider API keys, KEEL_API_KEYS, KEEL_SECRET_KEY, OAuth client secrets, or
# connector tokens here — those belong in a real secret manager (see
# ../base/secret-app.example.yaml and ../docs/security-model.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keel-app-config
  labels:
    app.kubernetes.io/part-of: keel
data:
  KEEL_APP_ENV: "production"
  KEEL_LOG_LEVEL: "INFO"
  KEEL_EVENT_STORE: "postgres"
  KEEL_DEFAULT_MODEL: "gpt-4o-mini"
  KEEL_SERVER_HOST: "0.0.0.0"
  KEEL_SERVER_PORT: "8000"
  # Force fail-closed auth in every environment this scaffold deploys to. Keel's own default
  # (packages/keel-core/src/keel_core/config.py `api_keys` empty -> implicit open admin) exists
  # for local/self-hosted single-user convenience (ADR-0008); a Kubernetes deployment is never
  # that use case, so it must not silently fall back to open mode if `KEEL_API_KEYS`
  # (../secret-app.example.yaml) is ever missing/emptied/misconfigured after this scaffold's
  # own validation has passed (e.g. an operator's own pipeline strips it later).
  #
  # CONSUMED BY APPLICATION CODE (M3.3): `Settings.cloud_mode`
  # (`packages/keel-core/src/keel_core/config.py`) drives `app.state.auth_required`
  # (`packages/keel-server/src/keel_server/app.py`), which `authenticate()`
  # (`packages/keel-server/src/keel_server/auth.py`) checks whenever no API key matched. With
  # `KEEL_CLOUD_MODE=true`, an empty, missing, or malformed `KEEL_API_KEYS` (every entry
  # skipped by `parse_api_keys`, e.g. no valid `key:role` shape) yields an empty key map, so
  # every request is rejected 503 "authentication is required in cloud mode but no API keys
  # are configured" instead of silently granting local implicit-admin access. See
  # ../docs/security-model.md "Required externally-supplied auth".
  KEEL_CLOUD_MODE: "true"
  # DB/Redis hostnames resolve to the Service references in base/datastores/. Point them at a
  # managed Postgres/Redis (recommended) or an in-cluster StatefulSet you operate yourself;
  # this scaffold does not ship a stock in-cluster database (see ../docs/storage-topology.md).
  KEEL_DATABASE_HOST: "keel-postgres.keel.svc.cluster.local"
  KEEL_REDIS_HOST: "keel-redis.keel.svc.cluster.local"
  # Optional stronger-isolation sandbox runtime (gVisor/Kata/microVM). Empty by default: the
  # control plane must not silently require one. Set to "gvisor" | "kata" | "microvm" only
  # after applying the matching RuntimeClass (../sandbox/runtimeclass.example.yaml) and
  # confirming node support — see ../docs/security-model.md "Pending gates". Wiring this
  # value through to sandbox Job creation is itself pending real sandbox integration.
  #
  # KEEL_EXECUTION_BACKEND / KEEL_SANDBOX_URL (not set here) DEFAULT TO A NOT-YET-DEPLOYED
  # SANDBOX SERVICE. `packages/keel-core/src/keel_core/config.py` defaults
  # `execution_backend` to `"sandbox"` and `sandbox_url` to `http://keel-sandbox:8090`:
  # `keel-server` and `keel-worker` (`keel_core.tools.wiring.build_service_execution_environment`)
  # both now route every shell/file tool call through the authenticated
  # `keel_core.tools.rpc.SandboxExecutionEnvironment` RPC client rather than running it
  # unconditionally in-process. Neither this scaffold nor `docker-compose.yml` ships a
  # `keel-sandbox` Deployment/Service (see ../../docs/OPERATIONS.md "Current
  # production-readiness limits"), so as deployed here `keel-server`/`keel-worker` start and
  # serve `/health`/`/readiness` normally, but every tool-execution call fails **closed**
  # ("unavailable") until a real, reachable `keel-sandbox` exists — this is the intended
  # fail-closed posture, not a bug. The only opt-out is explicitly setting
  # `KEEL_EXECUTION_BACKEND=unsafe-local-dev` *and*
  # `KEEL_TRUSTED_PREVIEW_ALLOW_UNSAFE_EXECUTION=true` (neither set here) to restore
  # unconditional in-process execution for a trusted single-org preview only. The per-run
  # sandbox `Job` template (`../sandbox/job-template.yaml`) is a separate, still-dormant
  # concept — a possible future execution-backend implementation reached through a
  # sandbox-controller, not the same thing as the `keel-sandbox` RPC service above, and
  # neither is wired up or dynamically created today. See ../docs/security-model.md
  # "Isolation levels" and "Pending gates".
  KEEL_SANDBOX_RUNTIME_CLASS: ""

# Identity for per-run sandbox Jobs (../sandbox/job-template.yaml). Deliberately has NO Role/
# RoleBinding anywhere in this scaffold and disables token automount, so a sandbox Pod that is
# fully compromised by injected/model-chosen commands still cannot call the Kubernetes API —
# not to list Secrets, not to read other Pods, not to create anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-sandbox-run
  labels:
    app.kubernetes.io/part-of: keel
    app.kubernetes.io/component: sandbox
automountServiceAccountToken: false

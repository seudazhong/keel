# Allow ingress to keel-web and keel-server only from the ingress-controller's namespace (or
# adjust the namespaceSelector to your ingress/gateway/mesh's actual label). Everything else
# stays denied by default-deny-all.yaml, including direct Pod-to-Pod access from unrelated
# namespaces sharing the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web-and-server
  labels:
    app.kubernetes.io/part-of: keel
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["keel-web", "keel-server"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_INGRESS_CONTROLLER_NAMESPACE
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8000
    - from:
        # keel-web -> keel-server proxying (see deploy/docker/web.nginx.conf); same-namespace
        # traffic between our own workloads.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keel-web
      ports:
        - protocol: TCP
          port: 8000

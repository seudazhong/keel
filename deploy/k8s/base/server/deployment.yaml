# keel-server: stateless FastAPI control-plane API. Architecturally horizontally scalable
# (see docs/ARCHITECTURE.md), but held at a single replica with a non-overlapping rollout `strategy`
# here — see the `replicas:`/`strategy:` comments below.
#
# SECURITY-CRITICAL: keel-server routes shell/file tool calls through
# `keel_core.tools.wiring.build_service_execution_environment`, which defaults to the
# authenticated `keel-sandbox` RPC client (`execution_backend=sandbox`,
# `packages/keel-core/src/keel_core/config.py`) rather than running them in-process. This
# scaffold does not ship a compatible sandbox Deployment/Service, so readiness fails closed
# until the execution plane is added. A process that can request model-chosen execution must
# never also hold a Kubernetes ServiceAccount token: that token would let an attacker pivot
# into the cluster API. This Pod therefore carries NO ServiceAccount token at all
# (`automountServiceAccountToken: false`, no `serviceAccountName`) and no RBAC grant exists
# anywhere in this scaffold for it — see ../../docs/security-model.md "Pending gates" for why
# per-run sandbox Job creation is not wired to this Deployment (and is a separate, still-
# dormant concept from the `keel-sandbox` RPC service above).
#
# `KEEL_API_KEYS` (in `../secret-app.example.yaml`) MUST contain an explicit global or
# org/Agent-bound machine credential before this is deployed. With `KEEL_CLOUD_MODE: "true"` forced in
# `../configmap-app.yaml`, empty/missing/malformed `KEEL_API_KEYS` fails every request
# **closed** (503) rather than granting local implicit-admin access
# (`packages/keel-core/src/keel_core/config.py` `api_keys`/`cloud_mode`,
# `packages/keel-server/src/keel_server/auth.py`, see ../../docs/OPERATIONS.md).
# `scripts/validate_manifests.py` fails the build if it is missing, empty, or malformed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  labels:
    app.kubernetes.io/name: keel-server
    app.kubernetes.io/part-of: keel
    app.kubernetes.io/component: control-plane
spec:
  # Held at 1 as a conservative deployment qualification gate. Runs and approvals are durable
  # and worker-owned, but multi-server SSE fan-out, OAuth callbacks, mixed-version routing, and
  # rolling upgrades have not been tested together. Raise this only with that evidence, and update
  # ../../overlays/production/patch-server-single-replica.yaml to match.
  replicas: 1
  # `replicas: 1` alone does not prevent overlap: Kubernetes' default `RollingUpdate` (25%
  # maxSurge/maxUnavailable) rounds maxSurge up to 1 even at a single replica, so it starts
  # the new Pod *before* removing the old one — an old and new keel-server would run
  # concurrently mid-rollout. `Recreate` terminates the old Pod before creating the new
  # one, so old and new server Pods are never scheduled at once. This trades a brief
  # (readiness-probe-bounded) request gap during upgrades for that guarantee — see
  # ../../docs/upgrade-rollback.md. `scripts/validate_manifests.py` and
  # tests/unit/test_deploy_k8s_manifests.py enforce both `replicas: 1` and this
  # non-overlapping strategy in the base and the rendered production overlay.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keel-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keel-server
        app.kubernetes.io/part-of: keel
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false # never mount a token into a shell-hosting process
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keel-server
          image: ghcr.io/OWNER/keel-app:REPLACE_WITH_PINNED_DIGEST
          command: ["keel-server"]
          # The image's WORKDIR is /app (its own read-only source tree, see
          # deploy/docker/app.Dockerfile). keel-server's `AgentRuntime` workspace and its
          # execution-environment setup uses `Path.cwd()` for control-plane scratch. Without
          # this override it resolves to /app, the read-only source tree. Redirecting cwd to a
          # dedicated writable scratch volume keeps /app immutable.
          workingDir: /workspace
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: keel-app-config
            - secretRef:
                name: keel-app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: project-storage
              mountPath: /var/lib/keel/projects
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: project-storage
          persistentVolumeClaim:
            claimName: keel-project-storage

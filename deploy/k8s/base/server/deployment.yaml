# keel-server: stateless FastAPI control-plane API. Architecturally horizontally scalable
# (ARCHITECTURE §15), but held at a single replica here — see the `replicas:` comment below.
#
# SECURITY-CRITICAL: keel-server currently executes `ShellTool`/model-chosen tool calls
# **in-process** (there is no deployed sandbox service yet — see
# ../../docs/security-model.md "Isolation levels"). A process that can run arbitrary shell
# commands must never also hold a Kubernetes ServiceAccount token: that token would let an
# attacker who reaches shell execution pivot straight into the cluster API. This Pod
# therefore carries NO ServiceAccount token at all (`automountServiceAccountToken: false`,
# no `serviceAccountName`) and no RBAC grant exists anywhere in this scaffold for it — see
# ../../docs/security-model.md "Pending gates" for why per-run sandbox Job creation is not
# wired to this Deployment.
#
# `KEEL_API_KEYS` (in `../secret-app.example.yaml`) MUST be set to a non-empty value before
# this is deployed: empty/unset makes every request an implicit, unauthenticated admin
# (`packages/keel-core/src/keel_core/config.py` `api_keys`, see ../../docs/OPERATIONS.md).
# `scripts/validate_manifests.py` fails the build if it is missing or empty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-server
  labels:
    app.kubernetes.io/name: keel-server
    app.kubernetes.io/part-of: keel
    app.kubernetes.io/component: control-plane
spec:
  # Held at 1 until durable interactive run/approval coordination lands: interactive runs and
  # pending tool-approval state are currently process-local (docs/OPERATIONS.md "Current
  # production-readiness limits"; M3.6 exit gate "restart/scale-out preserves run and approval
  # ownership"; M3.3 exit gate "Server restart does not lose an admitted run or pending
  # approval" — docs/ROADMAP.md). A second replica today would let a client's SSE stream or an
  # in-flight approval land on a Pod that never admitted that run, silently losing it. Raise
  # this only once that work ships, and update
  # ../../overlays/production/patch-server-single-replica.yaml to match.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keel-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keel-server
        app.kubernetes.io/part-of: keel
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false # never mount a token into a shell-hosting process
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keel-server
          image: ghcr.io/OWNER/keel-app:REPLACE_WITH_PINNED_DIGEST
          command: ["keel-server"]
          # The image's WORKDIR is /app (its own read-only source tree, see
          # deploy/docker/app.Dockerfile). keel-server's tool workspace defaults to
          # `Path.cwd()` (packages/keel-server/src/keel_server/app.py) — without this
          # override that resolves to /app, i.e. the read-only root filesystem below would
          # make every write/edit/shell tool call fail against the app's OWN source
          # directory. Redirecting cwd to a dedicated writable scratch volume keeps /app
          # read-only while giving today's in-process tool execution a real place to write.
          workingDir: /workspace
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: keel-app-config
            - secretRef:
                name: keel-app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi

# Base Kustomize resources for a single Keel org/tenant namespace. Overlays in ../overlays/*
# patch this base for an environment (dev/production). See ../README.md for validation and
# ../docs/ for storage, backup/DR, upgrade/rollback, and SLO runbooks.
#
# Deliberately NOT listed here (see each file's own header comment for why):
#   - secret-app.example.yaml, datastores/*.example.yaml,
#     networkpolicy/*.example.yaml            — templates with placeholder credentials/
#     hostnames/CIDRs; copy, fill from a real secret manager or your cluster's own network
#     data, and reference the copy from your own overlay instead.
#   - scheduler/deployment.example.yaml        — `keel-scheduler`'s entrypoint is currently a
#     stub that logs once and exits; deploying it as a long-lived Deployment would
#     crash-loop. Scheduling today happens inside keel-worker's own cron tick. Promote this
#     once the entrypoint is a real long-lived, leader-elected loop (M3.8).
#   - datastores/git-pvc.example.yaml          — no current service mounts or consumes this;
#     shipping it active would create a volume nothing reads/writes (see the file's header).
#   - sandbox/job-template.yaml                — rendered per-run by the control plane once a
#     real sandbox-controller exists (not applied once at install time; see
#     ../docs/security-model.md "Pending gates" — this scaffold does not grant keel-server
#     any RBAC to create Jobs directly).
#   - sandbox/runtimeclass.example.yaml        — opt-in stronger-isolation runtimes; add only
#     if your cluster has the matching node runtime installed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keel
resources:
  - namespace.yaml
  - configmap-app.yaml
  - server/deployment.yaml
  - server/service.yaml
  - worker/deployment.yaml
  - web/deployment.yaml
  - web/service.yaml
  - sandbox/serviceaccount.yaml
  - networkpolicy/default-deny-all.yaml
  - networkpolicy/allow-dns-egress.yaml
  - networkpolicy/allow-control-plane-egress.yaml
  - networkpolicy/allow-sandbox-egress-proxy-only.yaml
  - networkpolicy/allow-ingress-to-web-and-server.yaml
  - networkpolicy/allow-web-egress-to-server.yaml
  - networkpolicy/allow-server-ingress-from-sandbox.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: keel
    includeSelectors: false

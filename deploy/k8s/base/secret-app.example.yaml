# TEMPLATE — copy, fill from a real secret manager/CI pipeline, and never commit the result.
#
# This file is intentionally NOT listed in kustomization.yaml resources: it exists only as a
# documented shape for the Secret Keel's Deployments expect, so `kubectl kustomize build`
# never needs a filled-in secret to succeed (validated in ../scripts/validate_manifests.py).
#
# Preferred production pattern: do not hand-apply plaintext Secret manifests at all — use
# your platform's external-secret operator (e.g. External Secrets Operator, Sealed Secrets,
# or your cloud provider's CSI secret store driver) to sync from KMS/Vault into this Secret
# name/shape. See ../docs/security-model.md "Secrets" section.
apiVersion: v1
kind: Secret
metadata:
  name: keel-app-secret
  labels:
    app.kubernetes.io/part-of: keel
type: Opaque
stringData:
  # REQUIRED. Comma-separated `key:role` pairs (roles: viewer|operator|admin) — see
  # packages/keel-core/src/keel_core/config.py `api_keys`/`cloud_mode` and docs/OPERATIONS.md.
  # With `KEEL_CLOUD_MODE: "true"` forced in `base/configmap-app.yaml`, empty, missing, or
  # malformed (every entry rejected by `parse_api_keys`) fails every request **closed** (503)
  # rather than falling back to the local implicit-admin open mode — but this scaffold cannot
  # make that safe by itself if an operator later overrides `KEEL_CLOUD_MODE` to `"false"`, so
  # `scripts/validate_manifests.py` still fails the build if this key is absent, empty, or
  # syntactically malformed here.
  KEEL_API_KEYS: "CHANGEME-generate-a-real-random-key:admin"
  # Postgres/Redis connection strings (host comes from base/datastores/*-external-service; only
  # credentials/db name live here).
  KEEL_DATABASE_URL: "postgresql://CHANGEME_USER:CHANGEME_PASSWORD@keel-postgres.keel.svc.cluster.local:5432/keel"
  KEEL_REDIS_URL: "redis://keel-redis.keel.svc.cluster.local:6379/0"
  # Connector token envelope key (G18). Empty -> connector token store fails closed.
  KEEL_SECRET_KEY: "CHANGEME-generate-a-random-passphrase"
  # Set only the provider key(s) actually used; see .env.example for the full provider list.
  OPENAI_API_KEY: "CHANGEME"
  ANTHROPIC_API_KEY: "CHANGEME"

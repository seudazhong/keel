# TEMPLATE — copy, fill from a real secret manager/CI pipeline, and never commit the result.
#
# This file is intentionally NOT listed in kustomization.yaml resources: it exists only as a
# documented shape for the Secret Keel's Deployments expect, so `kubectl kustomize build`
# never needs a filled-in secret to succeed (validated in ../scripts/validate_manifests.py).
#
# Preferred production pattern: do not hand-apply plaintext Secret manifests at all — use
# your platform's external-secret operator (e.g. External Secrets Operator, Sealed Secrets,
# or your cloud provider's CSI secret store driver) to sync from KMS/Vault into this Secret
# name/shape. See ../docs/security-model.md "Secrets" section.
apiVersion: v1
kind: Secret
metadata:
  name: keel-app-secret
  labels:
    app.kubernetes.io/part-of: keel
type: Opaque
stringData:
  # REQUIRED. Comma-separated machine credentials. In cloud mode each must be either:
  #   key:role:org=<org-id-or-slug>:agent=<agent-id>
  # or an explicit bootstrap/global admin:
  #   key:admin:global
  # See packages/keel-server/src/keel_server/auth.py and docs/OPERATIONS.md.
  # With `KEEL_CLOUD_MODE: "true"` forced in `base/configmap-app.yaml`, empty, missing, or
  # malformed (every entry rejected by `parse_api_keys`) fails every request **closed** (503)
  # rather than falling back to the local implicit-admin open mode — but this scaffold cannot
  # make that safe by itself if an operator later overrides `KEEL_CLOUD_MODE` to `"false"`, so
  # `scripts/validate_manifests.py` still fails the build if this key is absent, empty, or
  # syntactically malformed here.
  KEEL_API_KEYS: "CHANGEME-generate-a-real-random-key:admin:global"
  # Postgres/Redis connection strings (host comes from base/datastores/*-external-service; only
  # credentials/db name live here).
  #
  # KEEL_DATABASE_URL is the LEAST-PRIVILEGE, NON-OWNER runtime login (keel_runtime_login) that
  # keel-server/keel-worker connect as. With KEEL_CLOUD_MODE "true"
  # (base/configmap-app.yaml) their readiness/startup fails **closed** unless this connection is
  # a non-owner, non-BYPASSRLS, non-table-owner login, so FORCE ROW LEVEL SECURITY is a real
  # tenant boundary. The privileged owner/migrator URL that runs migrations + mints this login
  # lives in a SEPARATE Secret (secret-migration.example.yaml) mounted only into the one-shot
  # migrate/provision Jobs (jobs-migrate-provision.example.yaml) - do NOT put
  # KEEL_MIGRATION_DATABASE_URL here. The password below MUST equal keel-migration-secret
  # KEEL_RUNTIME_DB_PASSWORD (rotate them together).
  KEEL_DATABASE_URL: "postgresql+psycopg://keel_runtime_login:CHANGEME-runtime-login-password@keel-postgres.keel.svc.cluster.local:5432/keel"
  KEEL_REDIS_URL: "redis://keel-redis.keel.svc.cluster.local:6379/0"
  # REQUIRED. Shared HMAC secret authenticating the control-plane<->keel-sandbox execution
  # RPC (packages/keel-core/src/keel_core/config.py `sandbox_rpc_secret`, consumed by
  # `keel_core.tools.wiring.build_service_execution_environment` at server/worker startup —
  # not lazily per-call). `execution_backend` defaults to `"sandbox"`
  # (base/configmap-app.yaml does not override it), so both keel-server and keel-worker build
  # an authenticated `SandboxExecutionEnvironment` client on startup; empty, missing, or
  # shorter-than-32-byte value makes `RpcRequestSigner.__init__`
  # (packages/keel-core/src/keel_core/tools/rpc_auth.py `MIN_RPC_SECRET_BYTES`) raise
  # immediately, so the Pod **crash-loops before serving `/health`** — unlike
  # `KEEL_API_KEYS`/`KEEL_CLOUD_MODE`, which fail closed per-request rather than at process
  # startup. Generate your own real value (e.g. `openssl rand -base64 32`) and configure the
  # identical value on the `keel-sandbox` service once one is deployed
  # (docs/security-model.md — this scaffold does not ship that service yet); the placeholder
  # below is exactly 61 bytes so `scripts/validate_manifests.py`'s
  # length check passes on a fresh checkout, but it is not a secret and MUST be replaced.
  KEEL_SANDBOX_RPC_SECRET: "CHANGEME-generate-a-real-random-32-byte-minimum-shared-secret"
  # Connector token envelope key (G18). Empty -> connector token store fails closed.
  KEEL_SECRET_KEY: "CHANGEME-generate-a-random-passphrase"
  # Set only the provider key(s) actually used; see .env.example for the full provider list.
  OPENAI_API_KEY: "CHANGEME"
  ANTHROPIC_API_KEY: "CHANGEME"

# TEMPLATE — copy, fill from a real secret manager/CI pipeline, and never commit the result.
#
# The PRIVILEGED owner/migrator credentials, kept in a SEPARATE Secret from keel-app-secret so it
# can be mounted into ONLY the one-shot migrate + provision Jobs (jobs-migrate-provision.example
# .yaml) and NEVER into the long-lived keel-server / keel-worker Pods. Those Pods get only the
# least-privilege runtime login (keel-app-secret `KEEL_DATABASE_URL`); with `KEEL_CLOUD_MODE:
# "true"` (base/configmap-app.yaml) their readiness/startup fails **closed** if that connection is
# actually a superuser / BYPASSRLS / table-owner principal (see
# ../../docs/OPERATIONS.md "Startup and database principals").
#
# Like secret-app.example.yaml this file is intentionally NOT in kustomization.yaml resources: it
# is a documented shape only. Prefer an external-secret operator (ESO/Sealed Secrets/CSI) syncing
# from KMS/Vault into this name/shape over hand-applying plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: keel-migration-secret
  labels:
    app.kubernetes.io/part-of: keel
type: Opaque
stringData:
  # Owner/migrator connection used ONLY by the migrate Job (Alembic `upgrade head`, needs DDL) and
  # the provision Job (CREATE ROLE / GRANT for the runtime login). This is the privileged Postgres
  # login; it MUST NOT be `KEEL_DATABASE_URL` on keel-server/keel-worker. `require_migration_data
  # base_url` (packages/keel-core/src/keel_core/config.py) consumes it; in cloud mode a missing
  # value fails closed rather than silently reusing the runtime login.
  KEEL_MIGRATION_DATABASE_URL: "postgresql+psycopg://keel:CHANGEME-owner-migrator-password@keel-postgres.keel.svc.cluster.local:5432/keel"
  # Password for the least-privilege runtime login (keel_runtime_login). The provision Job reads it
  # (default env var name for `keel_core.provision_runtime_cli`) to CREATE/ALTER the login, then
  # `--verify` reconnects as that login to prove it is non-owner. It MUST equal the password
  # embedded in keel-app-secret `KEEL_DATABASE_URL` (the runtime login the server/worker use), so
  # rotate both together. For stronger hygiene mount this as a file and pass
  # `--password-file` instead of an env var (see jobs-migrate-provision.example.yaml).
  KEEL_RUNTIME_DB_PASSWORD: "CHANGEME-runtime-login-password"

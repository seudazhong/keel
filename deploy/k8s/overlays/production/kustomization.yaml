# Production overlay: stricter Pod Security Admission enforcement and higher replica floors
# than base/dev. This still does NOT make the deployment safe for hostile multi-tenant
# workloads by itself — see ../../docs/security-model.md "Pending gates" for what remains
# (real sandbox isolation runtime, identity/tenancy enforcement, vertical integration).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-namespace-psa-enforce-restricted.yaml
    target:
      kind: Namespace
      name: keel
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name in (keel-server,keel-worker)
